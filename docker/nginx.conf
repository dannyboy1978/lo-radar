# ═══════════════════════════════════════════════════════════════════════════
# LO Radar · marketing nginx config
# ═══════════════════════════════════════════════════════════════════════════

# Force apex (strip www) for SEO consolidation
server {
  listen 80;
  server_name www.loradar.com;
  return 301 https://loradar.com$request_uri;
}

server {
  listen 80 default_server;
  server_name loradar.com _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/xml+rss image/svg+xml;
  gzip_min_length 256;

  # Serve trailing-slash routes WITHOUT a 301 redirect.
  # The default `$uri/` form triggers nginx's directory-add-trailing-slash
  # redirect (~750ms mobile latency penalty). $uri/index.html serves the
  # file directly with no redirect.
  location / { try_files $uri $uri/index.html $uri.html =404; }

  location /_astro/ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public, immutable";
  }

  location ~* \.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  location = /sitemap-index.xml { add_header Content-Type "application/xml"; }
  location = /sitemap.xml       { add_header Content-Type "application/xml"; }
  location = /robots.txt        { add_header Content-Type "text/plain"; }

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
  # Content-Security-Policy: tight for a marketing site that loads no third-party JS
  # outside the GHL booking widget (which opens via target=_blank, not embed).
  # Allows GA4 (gtag.js + google-analytics.com) which we wire when measurement ID lands.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
  server_tokens off;
}
